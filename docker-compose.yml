services:
  api:
    build: .
    container_name: beat-grid-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/measures.db
    volumes:
      - beat-grid-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  beat-grid-data:
